[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docfill-agent"
version = "0.1.0"
description = "LLM agent that fills DOCX templates via AST + MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicolas Mathieu" }]

dependencies = [
    "fastmcp>=2.0.0",
    "python-docx>=1.1.0",
    "agno>=1.5.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ipykernel>=6.0",
    "jupyter>=1.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docfill"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
